name: Pipeline

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: |
          python -m pytest -v --junitxml=test-results.xml

      - name: Test Results
        if: ${{ always() }}
        uses: dorny/test-reporter@v2
        with:
          name: Test Results
          path: test-results.xml
          reporter: java-junit

  model-gate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Take main model as baseline
        run: |
          git fetch --depth=1 origin main
          mkdir -p /tmp/baseline
          git show FETCH_HEAD:model/model.json > /tmp/baseline/model.json

      - name: Run model-quality gate
        run: |
          python gate.py /tmp/baseline model

  staging:
    needs:
      - test
      - model-gate

    if: github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    environment: staging

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-west-2
          mask-aws-account-id: true

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: build-image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --build-arg GIT_SHA="${IMAGE_TAG}" \
            -t "${REGISTRY}/hivecheck:${IMAGE_TAG}" \
            .

          docker push "${REGISTRY}/hivecheck:${IMAGE_TAG}"

          echo "image=${REGISTRY}/hivecheck:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Render staging task definition
        id: render-task-definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: infra/task-definition-staging.json
          container-name: hivecheck
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy staging
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-definition.outputs.task-definition }}
          service: hivecheck-api
          cluster: hivecheck-staging
          wait-for-service-stability: true

      - name: Smoke test staging
        run: |
          python smoke_test.py \
            "$(bash infra/service-url.sh staging)" \
            "${{ github.sha }}"

  production:
    needs: staging

    runs-on: ubuntu-latest

    environment: production

    concurrency: production

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-west-2
          mask-aws-account-id: true

      - name: Find image
        id: image
        env:
          SHA: ${{ github.sha }}
        run: |
          URI=$(aws ecr describe-repositories \
            --repository-names hivecheck \
            --query 'repositories[0].repositoryUri' \
            --output text)

          aws ecr describe-images \
            --repository-name hivecheck \
            --image-ids "imageTag=${SHA}" \
            >/dev/null

          echo "image=${URI}:$SHA" >> "$GITHUB_OUTPUT"

      - name: Render production task definition
        id: render-task-definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: infra/task-definition-production.json
          container-name: hivecheck
          image: ${{ steps.image.outputs.image }}

      - name: Deploy production
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-definition.outputs.task-definition }}
          service: hivecheck-api
          cluster: hivecheck-production
          wait-for-service-stability: true

      - name: Smoke test production
        run: |
          python smoke_test.py \
            "$(bash infra/service-url.sh production)" \
            "${{ github.sha }}"
